{% macro avatar(user, size='h-10 w-10 text-sm') %}
  {% if user.profile_pic and user.profile_pic != 'default.jpg' %}
    <img src="{{ url_for('static', filename='uploads/profile_pics/' ~ user.profile_pic) }}"
         alt="{{ user.username }}"
         class="{{ size }} shrink-0 rounded-full object-cover"
         onerror="this.hidden=true;this.nextElementSibling.hidden=false">
    <span hidden class="flex {{ size }} shrink-0 items-center justify-center rounded-full bg-brand-600 font-semibold text-white">
      {{ user.username | initials }}
    </span>
  {% else %}
    <span class="flex {{ size }} shrink-0 items-center justify-center rounded-full bg-brand-600 font-semibold text-white">
      {{ user.username | initials }}
    </span>
  {% endif %}
{% endmacro %}
