<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--tailwindcss-->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/tailwind.css') }}"
    />
    <!--fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="{{ url_for('static', filename='images/favicon.svg') }}" type="image/svg+xml">
    <title>{% if title %} {{ title }} {% else %} CourseHub {% endif %}</title>
  </head>
  <body class="flex min-h-full flex-col bg-gray-50 font-sans text-gray-900 antialiased mx-auto max-w-6xl px-4">
    {% include 'components/_navbar.html' %}

    <main id="app" class="page-container flex-1 py-8 {% block main_class %}{% endblock %}">
      {% include 'components/_flash.html' %} 
      {% block content %} {% endblock %}
    </main>

    {% include 'components/_footer.html' %}
    {% block scripts %}{% endblock %}
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  </body>
</html>
