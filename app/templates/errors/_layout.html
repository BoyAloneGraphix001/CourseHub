{% extends "base.html" %}


{% block main_class %}flex flex-col justify-center{% endblock %}

{% block content %}
<div class="card relative mx-auto w-full max-w-lg overflow-hidden">

  <div class="relative px-8 py-14 text-center">
    <p class="text-7xl font-bold tracking-tight text-brand-600 sm:text-8xl">{{ code }}</p>
    <h1 class="mt-4 text-2xl font-bold tracking-tight">{{ title }}</h1>
    <p class="mx-auto mt-2 max-w-sm leading-relaxed text-gray-600">{{ message }}</p>

    <div class="mt-8 flex flex-wrap justify-center gap-3">
      {% block error_actions %}
        <a href="{{ url_for('main.index') }}" class="btn-primary">Back to home</a>
        <a href="{{ url_for('main.catalog') }}" class="btn-outline">Browse courses</a>
      {% endblock %}
    </div>

    {% block error_extra %}{% endblock %}
  </div>
</div>
{% endblock %}
