{% extends "base.html" %}
{% block title %}Become an instructor | CourseHub{% endblock %}

{% block content %}
<div class="card mx-auto max-w-lg px-6 py-14 text-center">
  <p class="text-xl font-bold">Share what you know</p>
  <p class="mt-2 text-sm text-gray-600">Turn on instructor tools to create and publish free courses.</p>
  <form method="post" action="{{ url_for('student.become_instructor') }}" class="mt-6">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button class="btn-primary">Become an instructor</button>
  </form>
</div>
{% endblock %}
